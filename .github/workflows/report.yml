name: Report

# Builds the warehouse, renders the R / Quarto report and publishes it with GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the warehouse
        run: |
          pip install -r requirements.txt
          python run_pipeline.py

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pre-built Linux binaries: fast installs

      - name: Install R packages
        run: Rscript analysis/install_packages.R

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the report
        run: quarto render analysis/healthcare_report.qmd

      - name: Prepare the site
        run: |
          mkdir -p _site
          cp analysis/healthcare_report.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
